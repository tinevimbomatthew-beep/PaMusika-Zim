<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PaMusika - Zimbabwe</title>
<style>
body{font-family:Arial;margin:0;background:#f2f2f2}
header{background:#008751;color:#fff;text-align:center;padding:12px}header h1{margin:0}
.waBanner{background:#25D366;padding:12px;text-align:center}.waBanner a{color:#fff;font-weight:bold;text-decoration:none;font-size:15px}
.top{display:flex;justify-content:space-between;padding:10px;font-weight:bold}.active{background:#00e676;color:#000;padding:5px 10px;border-radius:20px}
nav{display:flex;gap:4px;padding:10px;background:#fff;flex-wrap:wrap}.navBtn{flex:1;padding:10px;border:none;border-radius:8px;background:#eee;font-weight:bold;font-size:13px}.activeBtn{background:#008751;color:#fff}
.tab{padding:12px}.hidden{display:none}
input,select{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
button{width:100%;padding:12px;margin:6px 0;background:#008751;color:#fff;border:none;border-radius:8px;font-weight:bold}
.waBtn{background:#25D366!important}.card{background:#fff;padding:12px;margin:8px 0;border-radius:10px}
.ecocashBox{background:#fff3e0;border:2px dashed #ff9800;padding:12px;border-radius:10px;text-align:center}
.cityRow{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.cityBtn{width:auto;padding:8px 12px;border-radius:20px;background:#fff;border:1px solid #008751;color:#008751;font-size:12px}.cityActive{background:#008751!important;color:#fff!important}
.footer{text-align:center;padding:20px;font-size:12px;color:#888}.footer a{color:#888;text-decoration:none}
.sync{font-size:11px;text-align:center;color:#008751;font-weight:bold}
</style>
<script>
var FIREBASE_URL="https://pamusika-zimbabwe-e4cec-default-rtdb.firebaseio.com";

var cart=[];var balance=0;var currentCity="All";var currentSuburb="All";
function saveToCloud(){
  document.getElementById('syncStatus').innerText="⏳ Saving to Cloud...";
  fetch(FIREBASE_URL+"/pamusika.json",{method:"PUT",body:JSON.stringify({sellers:sellers,products:products,balance:balance})}).then(function(){document.getElementById('syncStatus').innerText="✅ Saved to Cloud - Everyone sees it!"}).catch(function(){document.getElementById('syncStatus').innerText="⚠️ Offline - Saved locally";});
}
function loadFromCloud(){
  renderAll();
  document.getElementById('syncStatus').innerText="⏳ Loading sellers from Cloud...";
  fetch(FIREBASE_URL+"/pamusika.json").then(function(r){return r.json()}).then(function(data){
    if(data && data.sellers){sellers=data.sellers;products=data.products||[];balance=data.balance||0;document.getElementById('syncStatus').innerText="✅ Live - "+sellers.length+" sellers from Cloud";}

    renderAll();
  }).catch(function(){document.getElementById('syncStatus').innerText="⚠️ Offline - Showing saved sellers";renderAll()});
  setInterval(function(){fetch(FIREBASE_URL+"/pamusika.json").then(function(r){return r.json()}).then(function(data){if(data && data.sellers){sellers=data.sellers;products=data.products||[];renderAll()}}).catch(function(){})},10000);
}

function setCity(c,el){currentCity=c;currentSuburb="All";var btns=document.querySelectorAll('.cityBtn');for(var i=0;i<btns.length;i++){btns[i].classList.remove('cityActive')}if(el){el.classList.add('cityActive')}renderSuburbs();renderShop()}

function setSuburb(s,el){currentSuburb=s;var btns=document.querySelectorAll('#suburbRow .cityBtn');for(var i=0;i<btns.length;i++){btns[i].classList.remove('cityActive')}if(el){el.classList.add('cityActive')}renderShop()}
