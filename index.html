<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PaMusika - Zimbabwe's Biggest Marketplace</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial;margin:0;background:#fff}
header{background:#008751;color:#fff;text-align:center;padding:16px 12px}header h1{margin:0;font-size:32px}header p{margin:4px 0;font-size:15px}
.waTop{background:#008751;padding:12px;text-align:center;border-top:1px solid #fff}.waTop a{color:#fff;font-weight:bold;text-decoration:none}
nav{display:flex;gap:5px;padding:10px;background:#008751}
.navBtn{flex:1;padding:12px;border:2px solid #fff;background:#008751;color:#fff;font-weight:bold;border-radius:8px;cursor:pointer}
.activeBtn{background:#00c853!important}
.tab{padding:10px}.hidden{display:none!important}
input,textarea,select{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:6px}
button{width:100%;padding:12px;margin:6px 0;background:#008751;color:#fff;border:2px solid #008751;border-radius:6px;font-weight:bold;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:13px} th{background:#008751;color:#fff;padding:8px;text-align:left} td{border-bottom:1px solid #ddd;padding:8px} tr:nth-child(even){background:#f0f9f2}
.card{background:#f0f9f2;padding:10px;margin:8px 0;border-radius:8px;border:1px solid #008751}
.ecocashBox{background:#f0f9f2;border:2px dashed #008751;padding:12px;border-radius:8px;text-align:center}
.sync{text-align:center;font-size:12px;color:#008751;font-weight:bold}
.footer{text-align:center;padding:20px;font-size:12px;color:#888}
.smallBtn{width:auto;padding:6px 10px;margin:2px;font-size:12px;background:#008751!important;color:#fff!important;border:1px solid #008751}
.qtyBtn{width:32px;padding:6px;margin:0 2px;background:#008751!important;color:#fff!important}
.receiptBox{background:#fff;border:2px dashed #008751;padding:14px;border-radius:8px;font-family:monospace}
video{width:100%;border-radius:8px;background:#000}
.dashGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dashCard{background:#008751;color:#fff;padding:14px;border-radius:10px;text-align:center}
.dashCard b{font-size:22px;display:block}
</style>
</head
