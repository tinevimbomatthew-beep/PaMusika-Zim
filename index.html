<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PaMusika - Zimbabwe's Biggest Marketplace</title>
<style>
body{font-family:Arial;margin:0;background:#fff}
header{background:#008751;color:#fff;text-align:center;padding:16px 12px}header h1{margin:0;font-size:32px;cursor:pointer;user-select:none}header p{margin:4px 0;font-size:15px}
.waTop{background:#008751;padding:12px;text-align:center;border-top:1px solid #fff}.waTop a{color:#fff;font-weight:bold;text-decoration:none}
nav{display:flex;gap:5px;padding:10px;background:#008751} .navBtn{flex:1;padding:12px;border:2px solid #fff;background:#008751;color:#fff;font-weight:bold;border-radius:8px}.activeBtn{background:#00c853!important;color:#fff!important}
.tab{padding:10px}.hidden{display:none}
input,textarea,select{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}
button{width:100%;padding:12px;margin:6px 0;background:#008751;color:#fff;border:2px solid #008751;border-radius:6px;font-weight:bold}
table{width:100%;border-collapse:collapse;font-size:13px} th{background:#008751;color:#fff;padding:8px;text-align:left} td{border-bottom:1px solid #ddd;padding:8px} tr:nth-child(even){background:#f0f9f2}
.card{background:#f0f9f2;padding:10px;margin:8px 0;border-radius:8px;border:1px solid #008751}
.ecocashBox{background:#f0f9f2;border:2px dashed #008751;padding:12px;border-radius:8px;text-align:center}
.sync{text-align:center;font-size:12px;color:#008751;font-weight:bold}
.footer{text-align:center;padding:20px;font-size:12px;color:#888}
.smallBtn{width:auto;padding:6px 10px;margin:2px;font-size:12px;background:#008751!important;color:#fff!important;border:1px solid #008751}
.qtyBtn{width:32px;padding:6px;margin:0 2px;background:#008751!important;color:#fff!important}
.receiptBox{background:#fff;border:2px dashed #008751;padding:14px;border-radius:8px;font-family:monospace}
video{width:100%;border-radius:8px;background:#000}
.dashGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dashCard{background:#008751;color:#fff;padding:14px;border-radius:10px;text-align:center}
.dashCard b{font-size:22px;display:block}
.dashCard span{font-size:12px}
.lowCard{background:#f0f9f2;border:2px solid #008751;padding:10px;border-radius:8px;margin:6px 0}
.statRow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee;font-size:13px}
</style>
<script>
var FIREBASE_URL="https://pamusika-zimbabwe-e4cec-default-rtdb.firebaseio.com";
var sellers=[{name:"Tman",shop:"Tman Vegetables",phone:"0783264675",city:"Bulawayo",suburb:"Nkulumane",status:"approved"}];
var products=[
{name:"Potatoes",price:1,stock:32,shop:"Tman Vegetables",city:"Bulawayo",suburb:"Nkulumane",phone:"0783264675",barcode:"1234"},
{name:"Tomatoes",price:1.5,stock:50,shop:"Tman Vegetables",city:"Bulawayo",suburb:"Nkulumane",phone:"0783264675",barcode:"5678"}
];
var cart=[];var balance=0;var lastReceipt="";var scannerStream=null;var sales=[];var totalSold=0;var logoTaps=0;var logoTimer=null;
function saveToCloud(){var el=document.getElementById('syncStatus');if(el)el.innerText="⏳ Saving...";fetch(FIREBASE_URL+"/pamusika.json",{method:"PUT",body:JSON.stringify({sellers:sellers,products:products,balance:balance,sales:sales,totalSold:totalSold})}).then(function(){if(el)el.innerText="✅ Saved - Everyone sees it!"}).catch(function(){if(el)el.innerText="⚠️ Offline";});}
function loadFromCloud(){renderAll();checkSecretUrl();var el=document.getElementById('syncStatus');if(el)el.innerText="⏳ Loading...";fetch(FIREBASE_URL+"/pamusika.json").then(function(r){return r.json()}).then(function(data){if(data&&data.sellers){sellers=data.sellers;products=data.products||[];balance=data.balance||0;sales=data.sales||[];totalSold=data.totalSold||0;if(el)el.innerText="✅ Live - "+products.length+" products";}else{saveToCloud()}renderAll();}).catch(function(){if(el)el.innerText="⚠️ Offline - Showing saved";renderAll();});setInterval(function(){fetch(FIREBASE_URL+"/pamusika.json").then(function(r){return r.json()}).then(function(data){if(data&&data.sellers){sellers=data.sellers;products=data.products||[];sales=data.sales||[];renderAll()}}).catch(function(){})},10000);}
function checkSecretUrl(){if(window.location.search.indexOf("owner")!==-1){setTimeout(function(){ownerLogin()},500)}}
function secretTap(){
  logoTaps++;
  if(logoTimer){clearTimeout(logoTimer)}
  logoTimer=setTimeout(function(){logoTaps=0},2000);
  if(logoTaps>=5){logoTaps=0;ownerLogin()}
}
function showTab(id){var t=document.querySelectorAll('.tab');for(var i=0;i<t.length;i++){t[i].classList.add('hidden')}document.getElementById(id).classList.remove('hidden');var b=document.querySelectorAll('.navBtn');for(var j=0;j<b.length;j++){b[j].classList.remove('activeBtn')}if(event&&event.target){event.target.classList.add('activeBtn')}}
function isApproved(phone){for(var i=0;i<sellers.length;i++){if(sellers[i].phone===phone&&sellers[i].status==="approved"){return true}}return false}
function renderShop(){
  var q=document.getElementById('search').value.toLowerCase();
  var html="<table><tr><th>Product</th><th>Price ($)</th><th>Shop</th><th>City</th><th>Suburb</th><th>Order</th></tr>";
  var count=0;
  for(var i=0;i<products.length;i++){
    var p=products[i];
    if(!isApproved(p.phone)){continue}
    if(q && !(p.name.toLowerCase().includes(q)||p.shop.toLowerCase().includes(q)||p.city.toLowerCase().includes(q)||(p.suburb||"").toLowerCase().includes(q))){continue}
    count++;
    var wa="https://wa.me/263"+p.phone.substring(1)+"?text="+encodeURIComponent("Hi, I want "+p.name+" - $"+p.price+" from PaMusika");
    html+="<tr><td><b>"+p.name+"</b></td><td>$"+p.price+"</td><td>"+p.shop+"</td><td>"+p.city+"</td><td>"+(p.suburb||"")+"</td><td><a href='"+wa+"' target='_blank'><button class='smallBtn'>WhatsApp</button></a><button class='smallBtn' onclick='addToCartByIndex("+i+")'>+ Till</button></td></tr>";
  }
  html+="</table>";
  if(count===0){html="<p>No approved products yet. Be the first to sell!</p>"}
  document.getElementById('productList').innerHTML=html;
  document.getElementById('productCount').innerText="Showing "+count+" products - All Shops, All Products";
}
function addToCartByIndex(idx){
  var p=products[idx];
  if(p.stock<=0){alert(p.name+" out of stock!");return}
  var found=null;
  for(var i=0;i<cart.length;i++){if(cart[i].idx===idx){found=cart[i]}}
  if(found){found.qty++} else {cart.push({idx:idx,name:p.name,price:p.price,qty:1})}
  renderCart();
}
function renderCart(){
  var total=0;var html="";
  for(var i=0;i<cart.length;i++){var c=cart[i];var line=c.price*c.qty;total+=line;html+="<div class='card'>"+c.name+" - $"+c.price+" x "+c.qty+" = $"+line.toFixed(2)+" <button class='qtyBtn' onclick='changeQty("+i+",-1)'>-</button><button class='qtyBtn' onclick='changeQty("+i+",1)'>+</button><button class='smallBtn' onclick='removeCart("+i+")'>Remove</button></div>"}
  document.getElementById('cart').innerHTML=html||"<p>Cart empty - scan barcode or tap + Till</p>";
  document.getElementById('total').innerText="Total: $"+total.toFixed(2);
  updateChange();
}
function changeQty(i,d){cart[i].qty+=d;if(cart[i].qty<=0){cart.splice(i,1)}renderCart()}
function removeCart(i){cart.splice(i,1);renderCart()}
function clearCart(){cart=[];renderCart();document.getElementById('receipt').innerHTML=""}
function scanBarcode(){
  var code=document.getElementById('barcode').value.trim();
  if(!code){alert("Type barcode or scan with camera");return}
  var foundIdx=-1;
  for(var i=0;i<products.length;i++){if(String(products[i].barcode)===String(code)){foundIdx=i;break}}
  if(foundIdx>=0){addToCartByIndex(foundIdx);document.getElementById('barcode').value="";alert(products[foundIdx].name+" added to Till - Barcode knows it!")}else{alert("Barcode "+code+" NOT in system. Add it in Dashboard first with barcode "+code)}
}
async function startScanner(){
  var box=document.getElementById('scannerBox');box.classList.remove('hidden');
  var video=document.getElementById('scanVideo');
  try{
    scannerStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
    video.srcObject=scannerStream;video.play();
    if('BarcodeDetector' in window){
      var detector=new BarcodeDetector({formats:['ean_13','ean_8','code_128','upc_a','qr_code']});
      var loop=setInterval(async function(){
        if(!scannerStream){clearInterval(loop);return}
        try{var codes=await detector.detect(video);if(codes && codes.length>0){var val=codes[0].rawValue;document.getElementById('barcode').value=val;stopScanner();scanBarcode();}}catch(e){}
      },500);
    } else {document.getElementById('scanHint').innerText="Camera open - read barcode number and type it below.";}
  }catch(e){alert("Camera blocked - allow camera permission, or type barcode manually.");box.classList.add('hidden');}
}
function stopScanner(){if(scannerStream){scannerStream.getTracks().forEach(function(t){t.stop()});scannerStream=null}document.getElementById('scannerBox').classList.add('hidden')}
function updateChange(){
  var total=0;for(var i=0;i<cart.length;i++){total+=cart[i].price*cart[i].qty}
  var paid=parseFloat(document.getElementById('amountPaid').value)||0;
  document.getElementById('changeText').innerText=paid>0?"Change: $"+(paid-total).toFixed(2):"Enter amount customer paid to see change";
}
function checkout(){
  if(cart.length===0){alert("Cart empty");return}
  var total=0;for(var i=0;i<cart.length;i++){total+=cart[i].price*cart[i].qty}
  var method=document.getElementById('payMethod').value;
  var paid=parseFloat(document.getElementById('amountPaid').value)||total;
  var change=paid-total;
  var date=new Date().toLocaleString();
  var shopName=cart.length>0?products[cart[0].idx].shop:"PaMusika";
  var receipt="===== PaMusika RECEIPT =====\n"+shopName+"\n"+date+"\n--------------------------\n";
  for(var i=0;i<cart.length;i++){var c=cart[i];receipt+=c.name+" x "+c.qty+" @ $"+c.price+" = $"+(c.price*c.qty).toFixed(2)+"\n";var p=products[c.idx];p.stock=Math.max(0,p.stock-c.qty);}
  receipt+="--------------------------\nTOTAL: $"+total.toFixed(2)+"\nPAYMENT: "+method+"\nPAID: $"+paid.toFixed(2)+"\nCHANGE: $"+change.toFixed(2)+"\nEcoCash: 0783264675\nThank you! Come again";
  lastReceipt=receipt;balance+=total;totalSold+=total;
  sales.unshift({date:date,total:total,method:method,items:cart.map(function(c){return c.name+" x"+c.qty}).join(", ")});if(sales.length>50){sales=sales.slice(0,50)}
  cart=[];
  document.getElementById('receipt').innerHTML="<div class='receiptBox'><pre style='white-space:pre-wrap;margin:0'>"+receipt+"</pre><br><button onclick='printReceipt()'>🖨️ Print Receipt</button><button onclick='sendReceiptWhatsApp()'>💬 Send Receipt on WhatsApp</button><button onclick='clearReceipt()'>Clear Receipt</button></div>";
  document.getElementById('amountPaid').value="";saveToCloud();renderAll();renderCart();alert("Sale done! Stock deducted. Change: $"+change.toFixed(2));
}
function printReceipt(){var w=window.open('','','width=400,height=600');w.document.write("<pre>"+lastReceipt+"</pre>");w.document.close();w.print();}
function sendReceiptWhatsApp(){var num=document.getElementById('receiptPhone').value.trim()||"0783264675";var link="https://wa.me/263"+num.substring(1)+"?text="+encodeURIComponent(lastReceipt);window.open(link,'_blank');}
function clearReceipt(){document.getElementById('receipt').innerHTML="";lastReceipt=""}
function botStart(){document.getElementById('chatBox').innerHTML="PaMusika Bot: Type what you want<br>e.g. Potatoes in Nkulumane"}
function sendBot(){var input=document.getElementById('botInput');var text=input.value.trim();if(!text){return}var box=document.getElementById('chatBox');box.innerHTML+="<div><b>You:</b> "+text+"</div>";var low=text.toLowerCase();var reply="";for(var i=0;i<products.length;i++){var p=products[i];if(!isApproved(p.phone)){continue}if(low.includes(p.name.toLowerCase())||low.includes((p.suburb||"").toLowerCase())||low.includes(p.city.toLowerCase())||low.includes(p.shop.toLowerCase())){reply+="✅ "+p.name+" - $"+p.price+" | "+p.shop+" - "+p.city+" - "+(p.suburb||"")+" - 📞 "+p.phone+"<br>"}}if(!reply){reply="Sorry not found. Try: Potatoes in Nkulumane"}box.innerHTML+="<div><b>Bot:</b><br>"+reply+"</div>";input.value="";var waLink=document.getElementById('waBotLink');waLink.href="https://wa.me/263783264675?text="+encodeURIComponent("Hi PaMusika, I want: "+text);waLink.style.display="block";}
function registerSeller(){var name=document.getElementById('sName').value.trim();var shop=document.getElementById('sShop').value.trim();var phone=document.getElementById('sPhone').value.trim();var city=document.getElementById('sCity').value.trim();var suburb=document.getElementById('sSuburb').value.trim();var paid=document.getElementById('sPaid').checked;if(!name||!shop||!phone){alert("Fill Name + Shop + Phone");return}if(!city){alert("Type your City");return}if(!suburb){alert("Type your Suburb");return}if(!paid){alert("Tick YES, I sent $5 to 0783264675 first");return}for(var i=0;i<sellers.length;i++){if(sellers[i].phone===phone){document.getElementById('sellerStatus').innerHTML="You already registered as "+sellers[i].shop+" - Status: "+sellers[i].status.toUpperCase();alert("Already registered as "+sellers[i].shop+" - "+sellers[i].status);return}}sellers.push({name:name,shop:shop,phone:phone,city:city,suburb:suburb,status:"pending"});document.getElementById('sellerStatus').innerHTML="✅ Submitted! "+shop+" - PENDING. Owner will approve after checking EcoCash $5.";saveToCloud();renderAll();alert("Submitted! Wait for Approval.")}
function renderSellers(){var pend="";var appr="";for(var i=0;i<sellers.length;i++){var s=sellers[i];if(s.status==="pending"){pend+="<div class='card'><b>⏳ PENDING - "+s.shop+"</b> - "+s.name+"<br>📞 "+s.phone+" - "+s.city+" - "+(s.suburb||"")+"<br>💰 Claims $5 sent - CHECK ECOCASH!<br><button onclick='approveSeller("+i+")'>✅ APPROVE - I Got $5</button><button onclick='rejectSeller("+i+")'>✅ REJECT - No Payment</button></div>"}else{appr+="<div class='card'>✅ "+s.shop+" - "+s.name+" - "+s.phone+" - "+s.city+" - "+(s.suburb||"")+"</div>"}}document.getElementById('pendingList').innerHTML=pend||"<p>No pending sellers</p>";document.getElementById('approvedList').innerHTML=appr;var my="";for(var j=0;j<sellers.length;j++){my+="<div class='card'>"+sellers[j].shop+" - "+sellers[j].phone+" - "+sellers[j].city+" - "+(sellers[j].suburb||"")+" - "+sellers[j].status.toUpperCase()+"</div>"}document.getElementById('mySellers').innerHTML=my;}
function approveSeller(i){sellers[i].status="approved";saveToCloud();renderAll();alert(sellers[i].shop+" APPROVED!");}
function rejectSeller(i){sellers.splice(i,1);saveToCloud();renderAll();}
function addProduct(){var name=document.getElementById('pName').value.trim();var price=parseFloat(document.getElementById('pPrice').value);var stock=parseInt(document.getElementById('pStock').value);var shop=document.getElementById('pShop').value.trim()||"My Shop";var city=document.getElementById('pCity').value.trim();var suburb=document.getElementById('pSuburb').value.trim();var phone=document.getElementById('pPhone').value.trim()||"0783264675";var barcode=document.getElementById('pBarcode').value.trim()||Date.now().toString().slice(-4);if(!name||!price){alert("Fill Name + Price");return}if(!city){alert("Type City");return}if(!suburb){alert("Type Suburb");return}products.push({name:name,price:price,stock:stock||0,shop:shop,city:city,suburb:suburb,phone:phone,barcode:barcode});saveToCloud();renderAll();alert(name+" Added! Barcode "+barcode+" saved.")}
function bulkAdd(){var text=document.getElementById('bulkBox').value.trim();var shop=document.getElementById('pShop').value.trim()||"My Shop";var city=document.getElementById('pCity').value.trim();var suburb=document.getElementById('pSuburb').value.trim();var phone=document.getElementById('pPhone').value.trim()||"0783264675";if(!text){alert("Paste products first");return}if(!city||!suburb){alert("Type City + Suburb first");return}var lines=text.split("\n");var added=0;for(var i=0;i<lines.length;i++){var parts=lines[i].split(",");if(parts.length<2)continue;var n=parts[0].trim();var pr=parseFloat(parts[1]);var st=parseInt(parts[2])||0;var bc=parts[3]?parts[3].trim():Date.now().toString().slice(-4)+i;if(!n||!pr)continue;products.push({name:n,price:pr,stock:st,shop:shop,city:city,suburb:suburb,phone:phone,barcode:bc});added++;}saveToCloud();renderAll();alert(added+" products added!");document.getElementById('bulkBox').value="";}
function renderDashboard(){
  var approvedSellers=0;var pendingSellers=0;
  for(var i=0;i<sellers.length;i++){if(sellers[i].status==="approved"){approvedSellers++}else{pendingSellers++}}
  var totalStock=0;var lowList="";
  for(var j=0;j<products.length;j++){totalStock+=products[j].stock;if(products[j].stock<=5){lowList+="<div class='lowCard'>⚠️ LOW STOCK: <b>"+products[j].name+"</b> - Only "+products[j].stock+" left - "+products[j].shop+"</div>"}}
  if(!lowList){lowList="<p>✅ No low stock - all good!</p>"}
  var salesHtml="";
  for(var k=0;k<Math.min(sales.length,10);k++){salesHtml+="<div class='statRow'><span>"+sales[k].date+" - "+sales[k].items+"</span><b>$"+sales[k].total.toFixed(2)+"</b></div>"}
  if(!salesHtml){salesHtml="<p>No sales yet</p>"}
  document.getElementById('dashStats').innerHTML="<div class='dashGrid'><div class='dashCard'><b>$"+balance.toFixed(2)+"</b><span>Total Balance</span></div><div class='dashCard'><b>$"+totalSold.toFixed(2)+"</b><span>Total Sold</span></div><div class='dashCard'><b>"+products.length+"</b><span>Products</span></div><div class='dashCard'><b>"+approvedSellers+"</b><span>Approved Sellers</span></div></div><p style='font-size:13px'>⏳ Pending: "+pendingSellers+" | 📦 Total Stock in Store: "+totalStock+" items</p>";
  document.getElementById('dashLow').innerHTML=lowList;
  document.getElementById('dashSales').innerHTML=salesHtml;
  var stockHtml="<table><tr><th>Product</th><th>Price</th><th>QTY LEFT (SECRET)</th><th>Barcode</th><th>Shop</th><th></th></tr>";
  for(var m=0;m<products.length;m++){var p=products[m];var tag=isApproved(p.phone)?"✅ LIVE":"⏳ HIDDEN";stockHtml+="<tr><td>"+p.name+"</td><td>$"+p.price+"</td><td><b>"+p.stock+"</b></td><td>"+(p.barcode||"")+"</td><td>"+p.shop+" - "+tag+"</td><td><button class='smallBtn' onclick='deleteProduct
